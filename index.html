<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

small{color:var(--mu)}.c{background:var(--cd);border-radius:18px;padding:16px;margin:10px 0;box-shadow:var(--sh)}
.big{background:var(--hero);color:#fff;padding:22px 20px}.big small{color:rgba(255,255,255,.72)}.big b{display:block;font:700 56px/1.05 'Barlow Condensed',Impact,sans-serif;margin-top:4px}

.f{display:flex;flex-direction:column;gap:8px}input,select{width:100%;padding:13px;border:1.5px solid transparent;border-radius:12px;background:var(--bg);color:var(--tx);font:16px Barlow,sans-serif}input:focus,select:focus{outline:0;border-color:var(--ac)}
.hist{display:flex;gap:4px;margin-top:6px}.hd{flex:1;height:26px;border-radius:6px;background:var(--bd)}.hd.g{background:var(--ok)}.hd.r{background:var(--ro)}

#nav button{flex:1;border:0;background:none;padding:14px 0;color:var(--mu);font:600 15px Barlow,sans-serif}#nav button.on{color:#fff;background:var(--hero)}

:root{--soft:color-mix(in srgb,var(--tx) 7%,var(--cd))}
body,h1,h2,.big b,.b,input,select,textarea,.l,#nav button{font-family:'Plus Jakarta Sans',system-ui,sans-serif}
h1,h2,.big b{letter-spacing:-.02em}h1{font-size:28px;font-weight:800}h2{font-size:17px;font-weight:700}
.c{border-radius:26px;box-shadow:none;padding:18px}
.big{border-radius:30px;padding:26px 24px}.big b{font-size:44px;font-weight:800}

input,select,textarea{border-radius:16px;background:var(--soft)}

<script>

const firebaseConfig={apiKey:"AIzaSyAy_k00Csd_aJX71GAjm-pko9XUvsXqoTI",authDomain:"alquilaseguro-9fe02.firebaseapp.com",projectId:"alquilaseguro-9fe02",appId:"1:282504523219:web:01059beb5eb0950dd11326"};

const head=t=>`<div class="top"><h1>${t}</h1><button class="gear" aria-label="Configuración" onclick="go('ajustes')">${ICO}</button></div>`;

const wa=t=>{let d=String(t||'').replace(/\D/g,'').replace(/^0+/,'');if(!d)return '';if(d.startsWith('54'))return d;if(d.length===10)d='9'+d;return '54'+d};
const waLink=t=>wa(t)?`<a href="https://wa.me/${wa(t)}" target="_blank" rel="noopener">${esc(t)} (WhatsApp)</a>`:esc(t||'-');
const mapLink=c=>(c.direccion||c.provincia)?`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([c.direccion,c.provincia,'Argentina'].filter(Boolean).join(', '))}" target="_blank" rel="noopener">${esc([c.direccion,c.provincia].filter(Boolean).join(', '))} (ver en el mapa)</a>`:'-';
let db,auth,F,Au,user=null,emp=null,CT=[],R=[],tab='hoy',cur=null,q='',buscado=false,nom='';
const left=()=>Math.ceil((emp.trialHasta.toDate()-new Date())/864e5),locked=()=>!emp.suscripta&&left()<=0;
const banner=()=>emp.suscripta?'':`<div class="c note">${locked()?'La prueba terminó. Suscribite para seguir cargando.':'Prueba gratis: quedan '+left()+' días'}</div>`;
const pagado=c=>(c.pagos||[]).reduce((s,p)=>s+ +p.m,0);
const deuda=c=>c.estado==='cerrado'?+c.deudaCierre||0:Math.max(0,Object.values(c.dias||{}).filter(x=>x==='D').length*c.precio-pagado(c));
function atraso(c){const d=c.dias||{};let n=0,i=d[day(0)]?0:1;while(d[day(-i)]==='D'){n++;i++}return n}
const st=c=>c.estado==='cerrado'?(deuda(c)>0||(c.motivo&&c.motivo!=='Sin novedad'&&!c.saldadaEl)?3:0):atraso(c);
const badge=n=>`<span class="pill ${n>=3?'r':n>=1?'y':'g'}">${n>=3?'No alquilar':n>=1?'Precaución':'Buen cliente'}</span>`;
const cref=id=>F.doc(db,'empresas',user.uid,'contratos',id);
const sync=c=>F.setDoc(F.doc(db,'registro',c.dni,'entradas',c.id),{empresaId:user.uid,empresaNombre:emp.nombre,nombre:c.nombre,tel:c.tel||'',vehiculo:c.vehiculo||'',alta:c.alta,estado:c.estado,cerradoEn:c.cerradoEn||'',provincia:c.provincia||'',deuda:deuda(c),deudaOriginal:c.deudaOriginal||0,saldadaEl:c.saldadaEl||'',semaforo:st(c),motivo:c.motivo||'',hechos:c.hechos||'',actualizado:day(0)});

(async()=>{try{const A=await import(B+'firebase-app.js');Au=await import(B+'firebase-auth.js');F=await import(B+'firebase-firestore.js');
const app=A.initializeApp(firebaseConfig);auth=Au.getAuth(app);db=F.getFirestore(app);
Au.onAuthStateChanged(auth,async u=>{user=u;if(u){try{await load()}catch(x){$('#app').innerHTML='<div class="c">Error al cargar: '+esc(x.message)+'</div>'}}else{emp=null;draw()}})}
catch(x){$('#app').innerHTML='<div class="c">No se pudo iniciar: '+esc(x.message)+'</div>'}})();

async function load(){const ref=F.doc(db,'empresas',user.uid);let s=await F.getDoc(ref);
if(!s.exists()){await F.setDoc(ref,{nombre:nom||'Mi empresa',email:user.email,suscripta:false,trialHasta:F.Timestamp.fromDate(new Date(Date.now()+14*864e5))});s=await F.getDoc(ref)}
emp={id:user.uid,...s.data()};const c=await F.getDocs(F.collection(db,'empresas',user.uid,'contratos'));CT=c.docs.map(d=>({id:d.id,...d.data()}));draw()}
function go(t,id){tab=t;cur=id||null;draw();scrollTo(0,0)}
async function ingresar(reg){const e=E('em').value.trim(),p=E('pw').value;E('er').textContent='';nom=E('nm').value.trim();
try{reg?await Au.createUserWithEmailAndPassword(auth,e,p):await Au.signInWithEmailAndPassword(auth,e,p)}
catch(x){E('er').textContent=({'auth/invalid-credential':'Mail o contraseña incorrectos.','auth/email-already-in-use':'Ese mail ya tiene cuenta.','auth/weak-password':'La contraseña debe tener 6 caracteres o más.','auth/invalid-email':'El mail no es válido.'})[x.code]||x.message}}
const vAuth=()=>`<div style="background:#fff;border-radius:18px;padding:14px;text-align:center;margin:6px 0"><img src="logo.png" alt="Rento" style="max-width:230px;width:100%"></div><div class="c f"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Contraseña (mínimo 6 caracteres)"><input id="nm" placeholder="Nombre de tu empresa (solo para crear cuenta)"><small id="er" style="color:var(--ro)"></small><button class="b ac" onclick="ingresar(0)">Ingresar</button><button class="b" onclick="ingresar(1)">Crear cuenta, 14 días gratis</button></div>`;
async function mark(id,v){if(locked()){go('cuenta');return}const c=CT.find(x=>x.id===id),ds=v==='P'&&c.forma==='semanal'?[0,1,2,3,4,5,6]:[0],u={};
ds.forEach(i=>u['dias.'+day(i)]=v);await F.updateDoc(cref(id),u);c.dias=c.dias||{};ds.forEach(i=>c.dias[day(i)]=v);await sync(c);draw()}
function vHoy(){const L=CT.filter(c=>c.estado==='vigente'),Z=CT.filter(c=>c.estado==='cerrado'),tot=L.reduce((s,c)=>s+deuda(c),0);
return banner()+`${head(esc(emp.nombre))}<div class="c big"><small>Te deben en total</small><b>${fmt(tot)}</b></div><div class="row"><h2>Hoy, ${day(0)}</h2><button class="b" style="flex:0 0 auto;min-height:44px;font-size:16px" onclick="go('nuevo')">Agregar chofer</button></div>`+
(L.length?'':'<div class="c"><small>Todavía no cargaste choferes. Tocá "Agregar chofer" para empezar.</small></div>')+
[...L].sort((a,b)=>st(b)-st(a)).map(c=>`<div class="c"><div class="li" onclick="go('ficha','${c.id}')"><span class="av ${cls(st(c))}">${esc((c.nombre.trim()[0]||'?').toUpperCase())}</span><div class="t"><b>${esc(c.nombre)}</b><br><small>${esc(c.vehiculo)} · Debe ${fmt(deuda(c))}</small></div>${badge(st(c))}</div>
<div class="row"><button class="b ${(c.dias||{})[day(0)]==='P'?'sel':''}" onclick="mark('${c.id}','P')">Pagó${c.forma==='semanal'?' (7 días)':''}</button><button class="b ${(c.dias||{})[day(0)]==='D'?'selr':''}" onclick="mark('${c.id}','D')">Debe</button></div></div>`).join('')+
(Z.length?'<h2>Contratos cerrados</h2>'+Z.map(c=>`<div class="c" onclick="go('ficha','${c.id}')"><b>${esc(c.nombre)}</b> &nbsp;${badge(st(c))}<br><small>Cerrado el ${esc(c.cerradoEn)}. Deuda ${fmt(deuda(c))}</small></div>`).join(''):'')}
const vNuevo=()=>`<button class="l" onclick="go('hoy')">Volver</button><h1>Nuevo chofer</h1><div class="c f"><input id="n" placeholder="Nombre y apellido"><input id="dni" placeholder="DNI (solo números)" inputmode="numeric"><input id="tel" placeholder="Teléfono con código de área, sin 0 ni 15 (ej. 3816145326)" inputmode="tel"><select id="pv"><option value="">Provincia</option>${PROV.map(p=>`<option>${p}</option>`).join('')}</select><input id="dir" placeholder="Barrio y dirección (ej. Barrio Sur, Av. Mate de Luna 1200)"><input id="veh" placeholder="Vehículo">
<input id="pr" placeholder="Precio por día ($)" inputmode="numeric"><select id="fo"><option value="diario">Pago diario</option><option value="semanal">Semanal por adelantado</option></select>
<select id="pl"><option value="0">Sin plazo, se cobra por día</option><option value="1">Contrato de 1 mes</option><option value="3">Contrato de 3 meses</option><option value="6">Contrato de 6 meses</option></select>
<input id="mu" placeholder="Multa por rescisión ($, si hay plazo)" inputmode="numeric"><input id="an" placeholder="Anticipo o depósito ($)" inputmode="numeric"><small id="er" style="color:var(--ro)"></small><button class="b ac" onclick="addC()">Guardar chofer</button></div>`;
async function addC(){const v=i=>E(i).value.trim();if(locked()){go('cuenta');return}
if(!v('n')||!/^\d{6,9}$/.test(v('dni'))||!+v('pr')){E('er').textContent='Completá nombre, DNI (solo números) y precio por día.';return}
const ref=F.doc(F.collection(db,'empresas',user.uid,'contratos')),c={dni:v('dni'),nombre:v('n'),tel:v('tel'),provincia:E('pv').value,direccion:v('dir'),vehiculo:v('veh'),precio:+v('pr'),forma:v('fo'),plazo:+v('pl'),multa:+v('mu')||0,anticipo:+v('an')||0,alta:day(0),estado:'vigente',dias:{},pagos:[]};
try{await F.setDoc(ref,c);await sync({...c,id:ref.id})}catch(x){E('er').textContent=x.message;return}await load();go('hoy')}
function vFicha(){const c=CT.find(x=>x.id===cur),d=c.dias||{};let h='';for(let i=13;i>=0;i--){const v=d[day(-i)];h+=`<i class="hd ${v==='P'?'g':v==='D'?'r':''}"></i>`}
return `<button class="l" onclick="go('hoy')">Volver</button><h1>${esc(c.nombre)}</h1><div class="c">${badge(st(c))}<br>DNI ${esc(c.dni)}. Tel ${waLink(c.tel)}<br>Dirección: ${mapLink(c)}<br>${esc(c.vehiculo)}. ${fmt(c.precio)} por día, pago ${c.forma}${c.plazo?', contrato de '+c.plazo+' meses':''}<br><b>Deuda: ${fmt(deuda(c))}</b>${c.estado==='cerrado'?'<br><small>Cerrado el '+esc(c.cerradoEn)+'. Motivo: '+esc(c.motivo)+'</small>':''}</div>
<div class="c"><small>Últimos 14 días (verde pagó, rojo debe)</small><div class="hist">${h}</div></div>`+(c.estado==='vigente'?`
<div class="c f"><b>Registrar pago</b><input id="mp" placeholder="Monto recibido ($)" inputmode="numeric"><button class="b" onclick="pago()">Guardar pago</button></div>
<div class="c f"><b>Cerrar contrato</b><input id="dn" placeholder="Daños al vehículo ($)" inputmode="numeric"><input id="ot" placeholder="Otros conceptos ($)" inputmode="numeric">
<select id="mo"><option>Sin novedad</option><option>Deuda impaga</option><option>Daño al vehículo</option><option>Accidente</option><option>Manejo bajo efectos del alcohol</option><option>No devolvió el vehículo</option><option>Otro</option></select>
<input id="hc" placeholder="Hechos: qué pasó y cuándo"><button class="b selr" onclick="cerrar()">Calcular deuda y cerrar</button></div><button class="l" style="color:var(--ro)" onclick="borrar()">Eliminar este chofer (cargado por error)</button>`:(st(c)>=3?`<button class="b sel" style="width:100%" onclick="saldar()">Marcar como saldado o resuelto</button>`:''))+`<button class="b ac" style="width:100%" onclick="informe('${esc(c.dni)}')">Ver informe para PDF</button>`}
async function saldar(){const c=CT.find(x=>x.id===cur);if(!confirm('¿Confirmás que el chofer pagó toda la deuda? Queda registrado en su historial.'))return;const u={deudaOriginal:deuda(c),deudaCierre:0,saldadaEl:day(0)};await F.updateDoc(cref(c.id),u);await sync({...c,...u});await load()}
let impMsg='';
async function importar(){if(locked()){go('cuenta');return}
const M=['Deuda impaga','Daño al vehículo','Accidente','Manejo bajo efectos del alcohol','No devolvió el vehículo','Otro'],L=E('imp').value.split('\n').map(x=>x.trim()).filter(Boolean);let ok=0;const er=[];
for(let i=0;i<L.length;i++){const [n,dni,tel,prov,deu,mo,...h]=L[i].split(';').map(x=>x.trim());
if(!n||!/^\d{6,9}$/.test(dni||'')){er.push('Línea '+(i+1)+' sin nombre o DNI válido');continue}
const m=M.find(x=>x.toLowerCase()===(mo||'').toLowerCase()),d=+String(deu||'0').replace(/\D/g,'')||0,hechos=m?h.join('; '):[mo,...h].filter(Boolean).join('; ');
const ref=F.doc(F.collection(db,'empresas',user.uid,'contratos')),c={dni,nombre:n,tel:tel||'',provincia:PROV.includes(prov)?prov:'',direccion:'',vehiculo:'',precio:0,forma:'diario',plazo:0,multa:0,anticipo:0,alta:day(0),estado:'cerrado',cerradoEn:day(0),deudaCierre:d,detalle:{dd:d,mu:0,dn:0,ot:0,ant:0},motivo:m||'Otro',hechos};
try{await F.setDoc(ref,c);await sync({...c,id:ref.id});ok++}catch(x){er.push('Línea '+(i+1)+': '+x.message)}}
impMsg=ok+' cargados.'+(er.length?' Errores: '+er.join(' | '):'');await load()}
async function pago(){const m=+E('mp').value||0;if(m<=0)return;const c=CT.find(x=>x.id===cur),p={f:day(0),m};await F.updateDoc(cref(c.id),{pagos:F.arrayUnion(p)});c.pagos=[...(c.pagos||[]),p];await sync(c);draw()}
async function cerrar(){const c=CT.find(x=>x.id===cur),g=i=>+E(i).value||0,fin=new Date(c.alta+'T00:00');fin.setMonth(fin.getMonth()+c.plazo);
const mu=c.plazo&&new Date()<fin?+c.multa:0,dd=deuda(c),tot=dd+mu+g('dn')+g('ot')-c.anticipo,u={estado:'cerrado',cerradoEn:day(0),deudaCierre:Math.max(0,tot),detalle:{dd,mu,dn:g('dn'),ot:g('ot'),ant:+c.anticipo},motivo:E('mo').value,hechos:E('hc').value};
await F.updateDoc(cref(c.id),u);await sync({...c,...u});await load()}

const vBuscar=()=>banner()+`${head('Buscar por DNI')}<div class="c f"><input id="q" value="${esc(q)}" placeholder="DNI completo" inputmode="numeric"><button class="b ac" onclick="buscar()">Buscar</button></div><div id="res">${resH()}</div>`;

function vInf(){const w=Math.max(0,...R.map(r=>r.semaforo));return `<div class="no-print row"><button class="l" onclick="go('buscar')">Volver</button><button class="b ac" onclick="window.print()">Guardar como PDF</button></div>
<div class="c"><h1>Informe de chofer</h1><small>Emitido el ${new Date().toLocaleString('es-AR')} por ${esc(emp.nombre)}</small><h2>${esc(R[0]?R[0].nombre:'')}</h2><p>DNI ${esc(q)}. Tel ${waLink(R[0]?R[0].tel:'')}</p><p>Recomendación: ${badge(w)}<br><small>${R.length} registro${R.length===1?'':'s'} acumulado${R.length===1?'':'s'} a su nombre</small></p>`+
R.map(r=>`<p><b>${esc(r.empresaNombre)}</b>. ${esc(r.vehiculo)}<br>Alta ${esc(r.alta)}. ${r.estado==='cerrado'?'Cerrado el '+esc(r.cerradoEn):'Vigente'}<br>Deuda con ${esc(r.empresaNombre)}: <b>${fmt(r.deuda)}</b>${r.saldadaEl?'<br>Deuda original de '+fmt(r.deudaOriginal)+', saldada el '+esc(r.saldadaEl):''}${r.motivo?'<br>Motivo: '+esc(r.motivo):''}${r.hechos?'<br>Hechos: '+esc(r.hechos):''}</p>`).join('')+`<small>Datos informados por cada empresa. Ante un error, comunicarse con la empresa que lo cargó para corregirlo.</small></div>`}
const vCuenta=()=>`<h1>Cuenta</h1><div class="c f"><b>Nombre de tu empresa</b><input id="em2" value="${esc(emp.nombre)}"><button class="b" onclick="guardarNombre()">Guardar nombre</button></div>
<div class="c">${emp.suscripta?'<b>Suscripción activa</b><br>$25.000 por mes':'<b>Prueba gratis</b><br>Quedan '+Math.max(0,left())+' de 14 días. Después: $25.000 por mes.<br><br><button class="b ac" style="width:100%" onclick="window.open(LINK_PAGO,\'_blank\')">Suscribirme por $25.000 al mes</button><br><small>Pagá con el mismo mail con el que ingresás ('+esc(emp.email)+'). Te activamos la cuenta apenas se acredita el pago.</small>'}</div><div class="c f"><b>Importar lista de choferes</b><small>Una línea por chofer, separado por punto y coma:<br>nombre;DNI;teléfono;provincia;deuda;motivo;hechos</small><textarea id="imp" rows="6" style="width:100%;padding:13px;border:1.5px solid transparent;border-radius:12px;background:var(--bg);color:var(--tx);font:16px Barlow,sans-serif" placeholder="Juan Pérez;30111222;3816145326;Tucumán;150000;Daño al vehículo;Chocó la moto el 3/5"></textarea><button class="b" onclick="importar()">Importar</button></div>${impMsg?'<div class="c note">'+esc(impMsg)+'</div>':''}<button class="b" style="width:100%" onclick="salir()">Cerrar sesión</button>`;

const vAjustes=()=>`<button class="l" onclick="go('hoy')">Volver</button><h1>Configuración</h1>
<div class="c f"><b>Apariencia</b><small>Elegí cómo se ve la app.</small><div class="seg">${[['auto','Según el dispositivo'],['claro','Clara'],['oscuro','Oscura']].map(([v,t])=>`<button class="b ${tema()===v?'ac':''}" onclick="setTema('${v}')">${t}</button>`).join('')}</div></div>

<div class="c"><small>El aviso suena mientras la app esté abierta o instalada y activa en el celular. Para recibirlo con la app totalmente cerrada hace falta una etapa más, que se agrega después.</small></div>`;
async function guardarRec(){const on=E('rn').checked,h=E('rh').value||'09:00';
if(on){if(!('Notification' in window)){E('rn').checked=false;E('rm').textContent='Este navegador no permite notificaciones.';return}
if(Notification.permission!=='granted'&&await Notification.requestPermission()!=='granted'){E('rn').checked=false;E('rm').textContent='Tenés que permitir las notificaciones en el navegador.';return}}
try{localStorage.setItem('rec',JSON.stringify({on,h,last:rec().last||''}))}catch(e){}

if(new Date().toTimeString().slice(0,5)>=r.h&&r.last!==day(0)){const n=CT.filter(c=>c.estado==='vigente'&&!(c.dias||{})[day(0)]).length;r.last=day(0);try{localStorage.setItem('rec',JSON.stringify(r))}catch(e){}
