/* Deuda: recorre día por día. Cada día que queda deuda de alquiler sin pagar, suma el interés diario (% sobre el alquiler adeudado, sin interés sobre interés).

function cuentaDeuda(c){const pct=(+c.interes||0)/100,D=c.dias||{},P={};(c.pagos||[]).forEach(p=>P[p.f]=(P[p.f]||0)+ +p.m);

/* Lee reportes copiados de WhatsApp ("REPORTE DE CHOFER / CLIENTE"): nombre, empresa afectada, motivo, deuda y fecha */
function leerReportes(txt){const t=String(txt||'').replace(/[*_~]/g,'').replace(/\r/g,'');
let B=t.split(/REPORTE DE CHOFER[^\n]*/i).filter(b=>/Nombre\s*:/i.test(b));if(!B.length&&/Nombre\s*:/i.test(t))B=[t];
const H='(?:Nombre|Empresa afectada|Motivo del reporte|Fecha del incidente|DNI|Tel[eé]fono)';
const campo=(b,l)=>{const m=b.match(new RegExp(l+'[^:\\n]*:[ \\t]*\\n?[ \\t]*([^\\n]+)','i'));return m?m[1].trim():''};
const bloque=(b,l)=>{const m=b.match(new RegExp(l+'[^:\\n]*:([\\s\\S]*?)(?=\\n[^\\n]*'+H+'[^:\\n]*:|$)','i'));return m?m[1].replace(/\s*\n\s*/g,' ').replace(/\s*•\s*/g,' • ').replace(/^\s*•\s*/,'').trim():''};
return B.map(b=>{const mot=bloque(b,'Motivo del reporte'),dn=(campo(b,'DNI')||(b.match(/D\.?N\.?I\.?\D{0,6}(\d[\d.]{6,10})/i)||[])[1]||'').replace(/\D/g,''),
pesos=[...mot.matchAll(/\$\s?([\d.]+(?:,\d+)?)/g)].map(m=>+m[1].replace(/\./g,'').replace(/,\d+$/,'')),l=mot.toLowerCase();
const motivo=/alcohol|ebri/.test(l)?'Manejo bajo efectos del alcohol':/no devolv|se qued[oó] con|robo|desapareci/.test(l)?'No devolvió el vehículo':/accidente|choc/.test(l)?'Accidente':/daño|rotura|rompi/.test(l)?'Daño al vehículo':/deuda|debe|pago|pag[oó]/.test(l)?'Deuda impaga':'Otro';
return{nombre:campo(b,'Nombre'),acreedor:campo(b,'Empresa afectada'),fecha:campo(b,'Fecha del incidente'),dni:dn,deuda:pesos[0]||0,motivo,hechos:mot.slice(0,600)}}).filter(r=>r.nombre)}

<div class="c"><h1>Informe de chofer</h1><small>Emitido el ${new Date().toLocaleString('es-AR')} por ${esc(emp.nombre)}</small><h2>${esc(R[0]?R[0].nombre:'')}</h2><p>DNI ${esc(q)}. Tel ${waLink(R[0]?R[0].tel:'')}</p><p>Recomendación: ${badge(w)}<br><small>${R.length} registro${R.length===1?'':'s'} acumulado${R.length===1?'':'s'} a su nombre</small></p>`+
R.map(r=>`<p><b>${esc(acr(r))}</b>${r.acreedor?' (informado por '+esc(r.empresaNombre)+')':'. '+esc(r.vehiculo)}<br>${r.acreedor?(r.fechaIncidente?'Fecha del incidente: '+esc(r.fechaIncidente):'Cargado el '+esc(r.alta)):'Alta '+esc(r.alta)+'. '+(r.estado==='cerrado'?'Cerrado el '+esc(r.cerradoEn):'Vigente')}<br>Deuda con ${esc(acr(r))}: <b>${fmt(r.deuda)}</b>${r.saldadaEl?'<br>Deuda original de '+fmt(r.deudaOriginal)+', saldada el '+esc(r.saldadaEl):''}${r.motivo?'<br>Motivo: '+esc(r.motivo):''}${r.hechos?'<br>Hechos: '+esc(r.hechos):''}</p>`).join('')+`<small>Datos informados por cada empresa. Ante un error, comunicarse con la empresa que lo cargó para corregirlo.</small></div>`}
const vCuenta=()=>`<h1>Cuenta</h1><div class="c f"><b>Nombre de tu empresa</b><input id="em2" value="${esc(emp.nombre)}"><button class="b" onclick="guardarNombre()">Guardar nombre</button></div><div class="c f"><b>Interés diario por atraso</b><small>Porcentaje que se suma cada día sobre el alquiler adeudado. Queda precargado al agregar un chofer nuevo; en cada chofer lo podés cambiar.</small><input id="ei2" value="${+(emp.interes||0)}" placeholder="Ej.: 2" inputmode="decimal"><button class="b" onclick="guardarInteres()">Guardar interés</button></div>
<div class="c">${BETA?'<b>Versión beta, sin cargo</b><br>Rento está en etapa de prueba y la podés usar gratis con todas sus funciones.<br><br><small>Precio cuando se lance: '+PRECIO+' por mes. Te vamos a avisar antes de empezar a cobrar, y nada de lo que cargues se pierde.</small>':emp.suscripta?'<b>Suscripción activa</b><br>'+PRECIO+' por mes':'<b>Prueba gratis</b><br>'+(left()>0?(left()===1?'Queda 1 día':'Quedan '+left()+' días')+' de prueba.':'La prueba terminó.')+' Después: '+PRECIO+' por mes.<br><br><button class="b ac" style="width:100%" onclick="suscribir()">Suscribirme por '+PRECIO+' al mes</button><br><small>Pagá con el mismo mail con el que ingresás ('+esc(emp.email)+'). Te activamos la cuenta apenas se acredita el pago.</small>'}</div><div class="c f"><b>Importar lista de choferes</b><small>Una línea por chofer, separado por punto y coma:<br>nombre;DNI;teléfono;provincia;deuda;motivo;hechos</small><textarea id="imp" rows="6" style="width:100%;padding:13px;border:1.5px solid transparent;border-radius:12px;background:var(--bg);color:var(--tx);font:16px 'Plus Jakarta Sans',system-ui,sans-serif" placeholder="Juan Pérez;30111222;3816145326;Tucumán;150000;Daño al vehículo;Chocó la moto el 3/5"></textarea><button class="b" onclick="importar()">Importar</button></div>${vRep()}${impMsg?'<div class="c note">'+esc(impMsg)+'</div>':''}${botonInstalar()}<button class="b" style="width:100%" onclick="salir()">Cerrar sesión</button>`;
async function guardarInteres(){const n=pctOk(E('ei2').value);try{await F.updateDoc(F.doc(db,'empresas',user.uid),{interes:n})}catch(x){alert('No se pudo guardar: '+x.message);return}emp.interes=n;alert(n?'Listo: '+n+'% diario para los choferes nuevos.':'Listo: sin interés para los choferes nuevos.');draw()}
async function guardarNombre(){const n=E('em2').value.trim()||'Mi empresa';await F.updateDoc(F.doc(db,'empresas',user.uid),{nombre:n});emp.nombre=n;for(const c of CT)await sync(c);draw()}
async function salir(){await Au.signOut(auth)}
function suscribir(){if(!/^https?:\/\//.test(LINK_PAGO)){alert('El pago online todavía no está disponible. Escribinos para activar tu cuenta.');return}window.open(LINK_PAGO,'_blank')}
const vAjustes=()=>`<button class="l" onclick="go('hoy')">Volver</button><h1>Configuración</h1>
<div class="c f"><b>Apariencia</b><small>Elegí cómo se ve la app.</small><div class="seg">${[['auto','Según el dispositivo'],['claro','Clara'],['oscuro','Oscura']].map(([v,t])=>`<button class="b ${tema()===v?'ac':''}" onclick="setTema('${v}')">${t}</button>`).join('')}</div></div>
<div class="c f"><b>Tema de Halloween 🎃</b><small>Se activa solo del 15 de octubre al 2 de noviembre.</small><div class="seg">${[['auto','Automático'],['si','Siempre'],['no','Apagado']].map(([v,t])=>`<button class="b ${hwPref()===v?'ac':''}" onclick="setHw('${v}')">${t}</button>`).join('')}</div></div>
<div class="c f"><b>Recordatorio de cobro</b><small>Un aviso a la hora que elijas para marcar los pagos del día.</small><label class="sw"><input type="checkbox" id="rn" ${rec().on?'checked':''} onchange="guardarRec()">Activar recordatorio</label><input type="time" id="rh" value="${rec().h}" onchange="guardarRec()"><small id="rm"></small></div>
<div class="c"><small>El aviso suena mientras la app esté abierta o instalada y activa en el celular. Para recibirlo con la app totalmente cerrada hace falta una etapa más, que se agrega después.</small></div>`;
async function guardarRec(){const on=E('rn').checked,h=E('rh').value||'09:00';
if(on){if(!('Notification' in window)){E('rn').checked=false;E('rm').textContent='Este navegador no permite notificaciones.';return}
if(Notification.permission!=='granted'&&await Notification.requestPermission()!=='granted'){E('rn').checked=false;E('rm').textContent='Tenés que permitir las notificaciones en el navegador.';return}}
try{localStorage.setItem('rec',JSON.stringify({on,h,last:rec().last||''}))}catch(e){}
E('rm').textContent=on?'Listo: te avisamos todos los días a las '+h+'.':'Recordatorio apagado.'}
setInterval(async()=>{const r=rec();if(!r.on||!emp||!('Notification' in window)||Notification.permission!=='granted')return;
if(new Date().toTimeString().slice(0,5)>=r.h&&r.last!==day(0)){const n=CT.filter(c=>c.estado==='vigente'&&!(c.dias||{})[day(0)]).length;r.last=day(0);try{localStorage.setItem('rec',JSON.stringify(r))}catch(e){}
if(n){const o={body:'Tenés '+n+' chofer'+(n>1?'es':'')+' sin marcar hoy. Tocá para cobrar.',icon:'icon-192.png',tag:'cobro'},g=await navigator.serviceWorker.getRegistration();g?g.showNotification('Rento: hora de cobrar',o):new Notification('Rento: hora de cobrar',o)}}},30000);
/* ===== Vehículos, gastos y ganancia ===== */
const CATS=['Service','Aceite','Cubiertas','Frenos','Kit de arrastre / cadena','Batería','Reparación','Chapa y pintura','Seguro','Patente e impuestos','VTV','Multa','Repuestos','Otro'];
const vNom=v=>[v.nombre,v.patente&&v.patente.toUpperCase()].filter(Boolean).join(' · ');
const vref=id=>F.doc(db,'empresas',user.uid,'vehiculos',id);
const libre=v=>!CT.some(c=>c.vehiculoId===v.id&&c.estado==='vigente');
function vehDe(id,txt){const v=VH.find(x=>x.id===id);return v?{vehiculoId:v.id,vehiculo:vNom(v)}:{vehiculoId:'',vehiculo:txt}}
const mesNom=m=>{const t=new Date(m+'-15T12:00').toLocaleDateString('es-AR',{month:'long',year:'numeric'});return t[0].toUpperCase()+t.slice(1)};
function cambiarMes(k){const d=new Date(mes+'-15T12:00');d.setMonth(d.getMonth()+k);mes=d.toLocaleDateString('en-CA').slice(0,7);draw()}
/* Cobrado en el mes: días marcados "Pagó" (al precio de ese día) + pagos de deuda registrados */
const cobradoMes=(c,m)=>Object.entries(c.dias||{}).filter(([f,x])=>x==='P'&&f.startsWith(m)&&f<=day(0)).reduce((s,[f])=>s+precioEn(c,f),0)+(c.pagos||[]).filter(p=>String(p.f).startsWith(m)).reduce((s,p)=>s+ +p.m,0);
const ingVeh=(v,m)=>CT.filter(c=>c.vehiculoId===v.id).reduce((s,c)=>s+cobradoMes(c,m),0);
const gasVeh=(v,m)=>(v.gastos||[]).filter(g=>String(g.f).startsWith(m)).reduce((s,g)=>s+ +g.m,0);
const kpi=(i,g)=>`<div class="kpi"><div><small>Cobrado</small><b>${fmt(i)}</b></div><div><small>Gastos</small><b>${fmt(g)}</b></div><div><small>Ganancia</small><b style="color:${i-g<0?'var(--ro)':'var(--ok)'}">${i-g<0?'-':''}${fmt(Math.abs(i-g))}</b></div></div>`;
const selMes=()=>`<div class="row"><button class="b" style="flex:0 0 auto;min-height:40px" aria-label="Mes anterior" onclick="cambiarMes(-1)">‹</button><b style="flex:1;text-align:center">${mesNom(mes)}</b><button class="b" style="flex:0 0 auto;min-height:40px" aria-label="Mes siguiente" onclick="cambiarMes(1)" ${mes>=day(0).slice(0,7)?'disabled':''}>›</button></div>`;
function vVehs(){const I=VH.reduce((s,v)=>s+ingVeh(v,mes),0),G=VH.reduce((s,v)=>s+gasVeh(v,mes),0),sinV=CT.filter(c=>c.estado==='vigente'&&!c.vehiculoId).length;
return banner()+`${head('Vehículos')}<div class="c">${selMes()}${kpi(I,G)}</div><div class="row"><h2>Tu flota (${VH.length})</h2><button class="b" style="flex:0 0 auto;min-height:44px;font-size:16px" onclick="go('vnuevo')">Agregar vehículo</button></div>`+
(VH.length?'':'<div class="c"><small>Cargá tus motos y autos para ver cuánto gastás en cada uno y cuánto te deja por mes.</small></div>')+
(VH.length&&sinV?`<div class="c note"><small>${sinV} chofer${sinV>1?'es':''} sin vehículo asignado. Asignalo desde la ficha del chofer → Editar datos, así su cobro suma a la ganancia del vehículo.</small></div>`:'')+
[...VH].sort((a,b)=>(ingVeh(b,mes)-gasVeh(b,mes))-(ingVeh(a,mes)-gasVeh(a,mes))).map(v=>{const ch=CT.find(c=>c.vehiculoId===v.id&&c.estado==='vigente'),n=ingVeh(v,mes)-gasVeh(v,mes);
return `<div class="c li" onclick="go('veh','${v.id}')"><span class="av ${ch?'g':'y'}">${v.tipo==='auto'?'🚗':'🏍️'}</span><div class="t"><b>${esc(vNom(v))}</b><br><small>${ch?'Con '+esc(ch.nombre):'Sin chofer'} · Gastos ${fmt(gasVeh(v,mes))}</small></div><b style="color:${n<0?'var(--ro)':'var(--ok)'}">${n<0?'-':''}${fmt(Math.abs(n))}</b></div>`}).join('')}
const vVNuevo=()=>`<button class="l" onclick="go('vehs')">Volver</button><h1>Nuevo vehículo</h1><div class="c f"><div class="seg"><button class="b ac" id="tm" onclick="this.classList.add('ac');E('ta').classList.remove('ac')">🏍️ Moto</button><button class="b" id="ta" onclick="this.classList.add('ac');E('tm').classList.remove('ac')">🚗 Auto</button></div><input id="vn" placeholder="Marca y modelo (ej. Honda Wave 110)"><input id="vp" placeholder="Patente" autocapitalize="characters"><input id="vk" placeholder="Kilómetros actuales" inputmode="numeric"><small id="er" style="color:var(--ro)"></small><button class="b ac" onclick="addV()">Guardar vehículo</button></div>`;
async function addV(){if(locked()){go('cuenta');return}const n=E('vn').value.trim();if(!n){E('er').textContent='Escribí la marca y el modelo.';return}
const ref=F.doc(F.collection(db,'empresas',user.uid,'vehiculos')),v={nombre:n,patente:E('vp').value.trim().toUpperCase(),tipo:E('ta').classList.contains('ac')?'auto':'moto',km:+String(E('vk').value).replace(/\D/g,'')||0,alta:day(0),gastos:[]};
try{await F.setDoc(ref,v)}catch(x){E('er').textContent='No se pudo guardar: '+x.message;return}VH.push({id:ref.id,...v});go('veh',ref.id)}
function vVeh(){const v=VH.find(x=>x.id===cur);if(!v)return vVehs();const ch=CT.find(c=>c.vehiculoId===v.id&&c.estado==='vigente'),G=v.gastos||[],tot=G.reduce((s,g)=>s+ +g.m,0),ingT=CT.filter(c=>c.vehiculoId===v.id).reduce((s,c)=>s+Object.entries(c.dias||{}).filter(([f,x])=>x==='P'&&f<=day(0)).reduce((a,[f])=>a+precioEn(c,f),0)+pagado(c),0);
const porCat={};G.forEach(g=>porCat[g.cat]=(porCat[g.cat]||0)+ +g.m);
return `<button class="l" onclick="go('vehs')">Volver</button><h1>${v.tipo==='auto'?'🚗':'🏍️'} ${esc(v.nombre)}</h1><div class="c">${v.patente?'Patente <b>'+esc(v.patente)+'</b><br>':''}${v.km?'Kilometraje: '+(+v.km).toLocaleString('es-AR')+' km<br>':''}${ch?`Chofer: <a href="#" onclick="go('ficha','${ch.id}');return false">${esc(ch.nombre)}</a>`:'Sin chofer asignado'}</div>
<div class="c">${selMes()}${kpi(ingVeh(v,mes),gasVeh(v,mes))}</div>
<div class="c f"><b>Cargar gasto</b><select id="gc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input id="gm" placeholder="Monto ($)" inputmode="numeric"><input id="gf" type="date" value="${day(0)}" max="${day(0)}" aria-label="Fecha"><input id="gk" placeholder="Km al momento (opcional)" inputmode="numeric"><input id="gn" placeholder="Nota (opcional, ej. taller, marca de cubierta)"><button class="b ac" onclick="addG()">Guardar gasto</button></div>
${G.length?`<div class="c"><b>Gastos cargados</b>${[...G].sort((a,b)=>String(b.f).localeCompare(a.f)).map(g=>`<div class="row"><span style="flex:1;min-width:0">${esc(g.f)} · ${esc(g.cat)}${g.nota?'<br><small>'+esc(g.nota)+'</small>':''}${g.km?'<br><small>'+(+g.km).toLocaleString('es-AR')+' km</small>':''}</span><b>${fmt(g.m)}</b><button class="l" style="color:var(--ro);flex:0 0 auto" onclick="quitarG(${g.t})">Quitar</button></div>`).join('')}</div>
<div class="c"><b>Desde que lo cargaste</b><div class="row"><small>Cobrado</small><b>${fmt(ingT)}</b></div><div class="row"><small>Gastado</small><b>${fmt(tot)}</b></div>${Object.entries(porCat).sort((a,b)=>b[1]-a[1]).map(([k,m])=>`<div class="row"><small style="padding-left:12px">${esc(k)}</small><small>${fmt(m)}</small></div>`).join('')}<div class="row"><b>Ganancia</b><b style="color:${ingT-tot<0?'var(--ro)':'var(--ok)'}">${ingT-tot<0?'-':''}${fmt(Math.abs(ingT-tot))}</b></div></div>`:''}
<details class="c"><summary><b>Editar vehículo</b></summary><div class="f" style="margin-top:10px"><input id="vn" value="${esc(v.nombre)}" placeholder="Marca y modelo"><input id="vp" value="${esc(v.patente)}" placeholder="Patente"><input id="vk" value="${+v.km||''}" placeholder="Kilómetros" inputmode="numeric"><button class="b" onclick="editV()">Guardar cambios</button><button class="l" style="color:var(--ro)" onclick="borrarV()">Eliminar vehículo</button></div></details>`}
async function addG(){if(locked()){go('cuenta');return}const v=VH.find(x=>x.id===cur),m=+String(E('gm').value).replace(/\D/g,'');if(!m){alert('Escribí el monto del gasto, solo números.');return}
const f=E('gf').value||day(0),km=+String(E('gk').value).replace(/\D/g,'')||0,g={t:Date.now(),f,cat:E('gc').value,m,nota:E('gn').value.trim(),km},u={gastos:F.arrayUnion(g)};if(km>(+v.km||0))u.km=km;
try{await F.updateDoc(vref(v.id),u)}catch(x){alert('No se pudo guardar: '+x.message);return}v.gastos=[...(v.gastos||[]),g];if(u.km)v.km=km;draw()}
async function quitarG(t){const v=VH.find(x=>x.id===cur),g=(v.gastos||[]).find(x=>x.t===t);if(!g||!confirm('¿Quitar el gasto de '+fmt(g.m)+' ('+g.cat+')?'))return;
try{await F.updateDoc(vref(v.id),{gastos:F.arrayRemove(g)})}catch(x){alert('No se pudo quitar: '+x.message);return}v.gastos=v.gastos.filter(x=>x.t!==t);draw()}
async function editV(){const v=VH.find(x=>x.id===cur),u={nombre:E('vn').value.trim()||v.nombre,patente:E('vp').value.trim().toUpperCase(),km:+String(E('vk').value).replace(/\D/g,'')||0};
try{await F.updateDoc(vref(v.id),u);Object.assign(v,u);for(const c of CT.filter(c=>c.vehiculoId===v.id)){await F.updateDoc(cref(c.id),{vehiculo:vNom(v)});c.vehiculo=vNom(v);if(c.estado==='vigente')await sync(c)}}catch(x){alert('No se pudo guardar: '+x.message);return}draw()}
async function borrarV(){const v=VH.find(x=>x.id===cur);if(!confirm('¿Eliminar '+vNom(v)+' y sus gastos? Los choferes que lo usaron no se borran.'))return;
try{await F.deleteDoc(vref(v.id));for(const c of CT.filter(c=>c.vehiculoId===v.id)){await F.updateDoc(cref(c.id),{vehiculoId:''});c.vehiculoId=''}}catch(x){alert('No se pudo eliminar: '+x.message);return}VH=VH.filter(x=>x.id!==v.id);go('vehs')}
function draw(){const V={vehs:vVehs,veh:vVeh,vnuevo:vVNuevo,hoy:vHoy,nuevo:vNuevo,ficha:vFicha,buscar:vBuscar,cuenta:vCuenta,inf:vInf,ajustes:vAjustes};
if(!user||!emp){$('#app').innerHTML=user?'<small>Cargando...</small>':vAuth();$('#nav').style.display='none';return}
$('#app').innerHTML=V[tab]();$('#nav').style.display=tab==='inf'?'none':'flex';const t=tab==='ficha'||tab==='nuevo'?'hoy':tab==='veh'||tab==='vnuevo'?'vehs':tab;
document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
/* Instalar la app con un botón */
let instEv=null;
const instalada=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const esIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;draw()});
addEventListener('appinstalled',()=>{instEv=null;draw()});
async function instalar(){if(instEv){instEv.prompt();await instEv.userChoice;instEv=null;draw();return}
alert(esIOS()?'En iPhone: tocá el botón Compartir (el cuadrado con la flecha) y después "Agregar a inicio".':'Abrí el menú del navegador (los 3 puntitos) y tocá "Instalar app" o "Agregar a pantalla principal".')}
const botonInstalar=()=>instalada()?'':`<button class="b ac" style="width:100%;margin:8px 0" onclick="instalar()">📲 Instalar Rento en el celular</button>`;
</script></body></html>
